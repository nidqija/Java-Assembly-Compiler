name: Build and Test Java Compiler

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile and Run Java Compiler
        run: |
          javac *.java
          java Main

      - name: Assemble and Execute Generated Assembly
        run: |
          gcc -x assembler -no-pie assembly_code.asm -o program
          ./program

  